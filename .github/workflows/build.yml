name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch AirPlay / plist / ALAC sources
        run: scripts/fetch-deps.sh

      - name: Cache OpenSSL build
        uses: actions/cache@v4
        with:
          path: third_party/openssl-android
          key: openssl-3.0.15-api26-ndk27.2-v1

      - name: Build OpenSSL for Android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: scripts/build-openssl.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MirrorTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MirrorTV-apk
          path: MirrorTV.apk

      - name: Publish APK to the 'apk' branch
        run: |
          mkdir -p /tmp/apk && cp MirrorTV.apk /tmp/apk/
          echo "${GITHUB_SHA}" > /tmp/apk/BUILT_FROM.txt
          cd /tmp/apk
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add MirrorTV.apk BUILT_FROM.txt
          git commit -q -m "APK built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk
